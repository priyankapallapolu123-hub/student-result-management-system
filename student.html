<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="student.css">
    <script src="student.js"></script>
</head>

<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <div class="form-box">
            <label>Student Name</label>
            <input type="text" id="studentName" placeholder="Enter student name">

            <label>Python Marks</label>
            <input type="number" id="python" placeholder="Enter marks">

            <label>Java Marks</label>
            <input type="number" id="java" placeholder="Enter marks">

            <label>DBMS Marks</label>
            <input type="number" id="dbms" placeholder="Enter marks">

            <label>HTML Marks</label>
            <input type="number" id="html" placeholder="Enter marks">

            <label>CSS Marks</label>
            <input type="number" id="css" placeholder="Enter marks">

            <button onclick="calculateResult()">Calculate Result</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
